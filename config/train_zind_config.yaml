defaults:
  - problem: mazes_zind
  - override hydra/job_logging: custom
  - _self_

hydra:
  run:
    dir: ./outputs/${name}/training-${run_id}
  job_logging:
    handlers:
      file:
        filename: train.log

name: training_zind
# Set model_path to the best checkpoint from synthetic maze training.
# Example: outputs/training_default/training-<run_id>/model_best.pth
retrain: True
model_path:
